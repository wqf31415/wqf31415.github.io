name: Deploy to my server

on:
  push:
    branches: [source]
    
jobs:
  build:
    runs-on: ubuntu-latest
    name: Job to deploy blog
    steps:
      - name: checkout code
        id: checkout
        uses: actions/checkout@v2
        with:
          ref: source
          # submodules: true

      - name: use nodeJS
        uses: actions/setup-node@v1
        with:
          node-version: '20'

      - name: install hexo-cli
        run: npm install hexo-cli -g

      - name: install dependencies
        run: npm install

      - name: download theme
        run: git clone https://github.com/next-theme/hexo-theme-next themes/next

#      - name: download theme
#        run: npm install hexo-theme-next

      - name: cp config file
        run: |
          cp themes_config/next/_config.yml themes/next/
          cp themes_config/next/languages/zh-CN.yml themes/next/languages/

      - name: hexo generate
        run: hexo generate

      - name: package
        run: |
          tar -zcvf blog.tar.gz public/
#          jar -cvfM blog.war -C ./public/ .
#          zip blog.zip ./public/

